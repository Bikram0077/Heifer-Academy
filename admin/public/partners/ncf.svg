<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="NCF Nepal Logo">
  <rect width="240" height="64" rx="8" fill="#FFFFFF"/>
  <g transform="translate(14, 12)">
    <circle cx="20" cy="20" r="18" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
    <!-- Interlocking rings/cooperative hands -->
    <circle cx="16" cy="18" r="6" stroke="#1D4ED8" stroke-width="2" fill="none"/>
