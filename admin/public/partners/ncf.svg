  </g>
  <text x="64" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" letter-spacing="0.5">NCF NEPAL</text>
  <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569">Nat'l Cooperative Federation</text>
